# Render Blueprint for the FastAPI backend. Deploy with:
# Render dashboard -> New -> Blueprint -> point at this repo (the repo root is this folder).
services:
  - type: web
    name: proyecto3d-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # Vercel URL(s), comma-separated
      - key: OMNIROUTE_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: OMNIROUTE_MODEL
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render's proxy appends the client IP to X-Forwarded-For (assumed; see README)
